name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      # ffmpeg/ffprobe are a system prerequisite (used by enhance/view/frame
      # extraction); the unit suite exercises them.
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      # Advisory surface only — non-blocking at first (|| true).
      - run: npm audit --omit=dev --audit-level=high || true
      # version is single-sourced from package.json; fail if any surface drifted.
      - run: node scripts/sync-version.mjs --check
      - run: npm run typecheck
      - run: npm run build
      # Phase 0 acceptance check: the built entrypoint must actually run.
      - run: node dist/bin/overcast.js --version --json
      # skills/ is generated from the verb registry (src/verbs/skills.ts) — the
      # CLI/tool/skill surfaces share one source of truth, so a registry/verb
      # change must be regenerated + committed. Regenerate and fail on any drift
      # (staged, so a NEW uncommitted skill file is caught too, not only edits to
      # tracked ones).
      - name: skills/ in sync with the verb registry
        run: |
          node dist/bin/overcast.js skills generate
          git add -A skills/
          git diff --cached --exit-code -- skills/
      - run: npm test
      # Offline e2e: fixture providers, no network/creds (test/e2e/README.md).
      # SKIP_BUILD=1 reuses the dist built two steps up.
      - run: SKIP_BUILD=1 bash test/e2e/run.sh
      # VS Code extension (vscode/ — its own npm package, NOT npm-published;
      # sideloaded as a .vsix). Typecheck imports root src/ types, so registry
      # refactors that break the extension fail here.
      - run: npm ci --prefix vscode
      - run: npm run --prefix vscode typecheck
      - run: npm run --prefix vscode build
      - run: npm run --prefix vscode test
      - run: mkdir -p .dev && npm run --prefix vscode package
      - uses: actions/upload-artifact@v4
        with:
          name: overcast-vscode-vsix
          path: .dev/*.vsix
          if-no-files-found: error
          # the vsix lands in .dev/ — a dotted dir, which upload-artifact@v4
          # silently excludes unless hidden files are opted in.
          include-hidden-files: true

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          find . -name '*.sh' -not -path './node_modules/*' -print0 \
            | xargs -0 -r shellcheck -S warning
