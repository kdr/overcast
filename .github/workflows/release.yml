# Release: publish @kdrrr/overcast to npm via OIDC trusted publishing (no token),
# then cross-compile the standalone bun binary for macOS/Linux and attach the
# tarballs to the GitHub Release. Triggered by pushing a v* tag.
#
# One-time setup (maintainer): see RELEASING.md — configure the npmjs Trusted
# Publisher for @kdrrr/overcast (GitHub Actions → repo kdr/overcast → workflow
# release.yml) AFTER the first manual publish.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (must equal package.json version)"
        required: true

permissions:
  contents: write # create the GitHub Release + upload binary assets
  id-token: write # OIDC for npm trusted publishing (provenance is automatic)

jobs:
  npm-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22" # match ci.yml — test and publish on the same Node major
          # npm-recommended trusted-publishing config. With no NODE_AUTH_TOKEN set,
          # npm >= 11.5.1 ignores setup-node's .npmrc token placeholder and auths via
          # OIDC. Ref: https://docs.npmjs.com/trusted-publishers/
          registry-url: "https://registry.npmjs.org"
      # Trusted publishing needs npm >= 11.5.1; pin to latest to be safe.
      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@latest
          npm --version
      - name: Verify tag matches package.json version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$PKG_VERSION" ]; then
            echo "::error::tag/input version ($VERSION) != package.json version ($PKG_VERSION)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        id: ver
      # ffmpeg/ffprobe are a system prerequisite exercised by the unit suite.
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: node scripts/sync-version.mjs --check
      - run: npm run typecheck
      - run: npm run build
      - run: node dist/bin/overcast.js --version --json
      - run: npm test
      - name: Publish to npm (OIDC trusted publishing — no token)
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          if npm view "@kdrrr/overcast@$VERSION" version >/dev/null 2>&1; then
            echo "@kdrrr/overcast@$VERSION is already published — skipping publish."
          else
            npm publish
          fi

  # VS Code extension: package the .vsix, attach it to the same GitHub Release,
  # and publish it to the VS Code Marketplace + Open VSX. Its version is stamped
  # by scripts/sync-version.mjs (checked in the npm-publish job), so the .vsix
  # always matches the tag. The publish steps are config-gated (Entra ID OIDC
  # via the AZURE_* repo variables, or VSCE_PAT / OVSX_PAT — see RELEASING.md)
  # and skip when the version is already live, so re-running a tag is safe and
  # the job passes before the one-time setup.
  #
  # `environment: release` gives the GitHub OIDC token a STABLE subject
  # (`repo:<owner>/<repo>:environment:release`) that the managed identity's
  # federated credential trusts — without it, the subject is per-tag and would
  # need a credential per release.
  vsix:
    needs: npm-publish
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            vscode/package-lock.json
      # Root deps too: the extension's typecheck/build import types from src/.
      - run: npm ci
      - run: npm ci --prefix vscode
      - run: npm run --prefix vscode typecheck
      - run: npm run --prefix vscode build
      - run: npm run --prefix vscode test
      - run: mkdir -p .dev && npm run --prefix vscode package
      # Attach the .vsix to the Release BEFORE publishing, so the downloadable
      # artifact is guaranteed even if a Marketplace/Open VSX publish later fails
      # (a bad PAT, a registry hiccup) — the manual download+upload path always
      # has a file to grab.
      - name: Attach the .vsix to the GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v3
        with:
          files: .dev/*.vsix
          fail_on_unmatched_files: true
      # Entra ID OIDC (preferred): exchange the GitHub OIDC token for an Azure
      # token as the managed identity behind vars.AZURE_CLIENT_ID. `vsce publish
      # --azure-credential` then mints a Marketplace token via the logged-in
      # Azure CLI — no stored PAT. Runs only when OIDC is configured; the PAT
      # path below is the fallback.
      - name: Azure login (OIDC — for Marketplace publish)
        if: github.event_name == 'push' && vars.AZURE_CLIENT_ID != ''
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Publish to the VS Code Marketplace
        if: github.event_name == 'push'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          HAVE_OIDC: ${{ vars.AZURE_CLIENT_ID != '' }}
        run: |
          VSCE=vscode/node_modules/.bin/vsce
          VERSION="$(node -p "require('./vscode/package.json').version")"
          # Idempotent like the npm publish so re-running a tag is safe. `vsce
          # show --json` lists every published version on its own line (and
          # prints `undefined`, exit 0, before the first publish — no match →
          # publish); a match means this version is already live → skip.
          if "$VSCE" show kdrrr.overcast --json 2>/dev/null | grep -q "\"version\": \"$VERSION\""; then
            echo "kdrrr.overcast@$VERSION is already on the Marketplace — skipping publish."
          elif [ "$HAVE_OIDC" = "true" ]; then
            "$VSCE" publish --azure-credential --packagePath .dev/*.vsix
          elif [ -n "$VSCE_PAT" ]; then
            "$VSCE" publish -p "$VSCE_PAT" --packagePath .dev/*.vsix
          else
            echo "No Marketplace auth configured (set the AZURE_* variables for OIDC, or VSCE_PAT) — skipping (see RELEASING.md)."
          fi
      - name: Publish to Open VSX
        if: github.event_name == 'push'
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "OVSX_PAT secret not set — skipping Open VSX publish (see RELEASING.md)."
            exit 0
          fi
          VERSION="$(node -p "require('./vscode/package.json').version")"
          if curl -fsS "https://open-vsx.org/api/kdrrr/overcast/$VERSION" >/dev/null 2>&1; then
            echo "kdrrr.overcast@$VERSION is already on Open VSX — skipping publish."
          else
            npx --yes ovsx@1.0.2 publish .dev/*.vsix -p "$OVSX_PAT"
          fi
      - name: Upload the .vsix as a workflow artifact (manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: overcast-vscode-vsix
          path: .dev/*.vsix
          if-no-files-found: error
          include-hidden-files: true

  binaries:
    needs: npm-publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22" # match ci.yml — test and publish on the same Node major
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # Deps are needed: bun-sidecar.mjs copies pi's builtin themes out of
      # node_modules, and `bun --compile` resolves imports from node_modules.
      - run: npm ci
      # The chair console SPA — bun-sidecar.mjs copies assets/chair-console
      # beside each binary (this job never runs `npm run build`).
      - run: npm run build:web
      - name: Cross-compile binaries + sidecar trees
        run: |
          set -euo pipefail
          mkdir -p dist/release
          for target in bun-darwin-arm64 bun-darwin-x64 bun-linux-x64 bun-linux-arm64; do
            osarch="${target#bun-}"
            out="dist/release/$osarch"
            mkdir -p "$out"
            echo "→ building $osarch"
            bun build --compile --target="$target" bin/overcast.ts --outfile "$out/overcast"
            node scripts/bun-sidecar.mjs "$out"
            tar -C "$out" -czf "dist/release/overcast-$osarch.tar.gz" .
          done
          ls -lh dist/release/*.tar.gz
      - name: Attach binaries to the GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v3
        with:
          files: dist/release/*.tar.gz
          fail_on_unmatched_files: true
      - name: Upload binaries as workflow artifacts (manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: overcast-binaries
          path: dist/release/*.tar.gz
