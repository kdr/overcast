<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#050708" />
    <!-- Local media + API stay same-origin; https: allows OSM map tiles and the
         (server-gated, off-by-default) remote thumbs — the server strips remote
         URLs from the snapshot unless OVERCAST_REPORT_REMOTE_MEDIA=1. -->

      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src 'self' data: https:; media-src 'self' https:; connect-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src data:"
    />
